name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: CLI smoke test
        env:
          TELEGRAM_BOT_TOKEN: ci-only
          TELEGRAM_CHAT_ID: "1"
          SLACK_WEBHOOK_URL: https://hooks.example.invalid/ci
        run: |
          logwatch-alert --version
          logwatch-alert packs
          logwatch-alert -c examples/config.yaml check-config
          logwatch-alert test --pack ssh --expect-alert examples/sample-auth.log
          printf 'kernel: Out of memory: Killed process 7 (java)\n' > "$RUNNER_TEMP/kern.log"
          printf 'packs: [oom]\n' > "$RUNNER_TEMP/oom.yaml"
          logwatch-alert -c "$RUNNER_TEMP/oom.yaml" run --stdin --dry-run < "$RUNNER_TEMP/kern.log" | grep -q '"rule": "oom-kill"'

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t logwatch-alert:ci .
      - run: docker run --rm logwatch-alert:ci --version
      - name: Rule packs work inside the image
        run: |
          docker run --rm -i logwatch-alert:ci test --pack ssh --expect-alert - < examples/sample-auth.log
      - name: Start the container and wait for a healthy heartbeat
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          touch "$RUNNER_TEMP/logs/app.log"
          chmod 644 "$RUNNER_TEMP/logs/app.log"
          cat > "$RUNNER_TEMP/config.yaml" <<'YAML'
          sources:
            - path: /logs/app.log
          rules:
            - name: ci
              pattern: CI-ERROR
          notifiers:
            hook:
              type: webhook
              url: http://127.0.0.1:9/unused
          YAML
          docker run -d --name lw \
            -v "$RUNNER_TEMP/config.yaml:/config/config.yaml:ro" \
            -v "$RUNNER_TEMP/logs:/logs:ro" logwatch-alert:ci
          for i in $(seq 1 20); do
            docker exec lw logwatch-alert healthcheck && exit 0
            sleep 1
          done
          docker logs lw
          exit 1
