[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logwatch-alert"
dynamic = ["version"]
description = "Tail log files or docker logs, match YAML rules (regex, thresholds, JSON fields) and send deduplicated alerts to Telegram, Slack, Discord, ntfy, webhooks and e-mail. Ready-made packs for nginx 5xx, PHP fatals, SSH brute force and OOM kills."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saizul Amin" }]
keywords = ["logs", "log-monitoring", "alerting", "tail", "telegram", "slack", "discord", "nginx", "ssh", "oom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/logwatch-alert"
Issues = "https://github.com/saizul/logwatch-alert/issues"
Changelog = "https://github.com/saizul/logwatch-alert/blob/main/CHANGELOG.md"

[project.scripts]
logwatch-alert = "logwatch_alert.cli:main"

[tool.setuptools.dynamic]
version = { attr = "logwatch_alert._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logwatch_alert = ["py.typed", "packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
